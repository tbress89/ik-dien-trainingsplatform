<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["oefeningen","trainingen"],"default":"oefeningen"},"$preview":{"width":1440,"height":72}}'>
class Component extends DCLogic {
renderVals() {
const a = this.props.active || 'oefeningen';
const base = 'height: 72px; box-sizing: border-box; display: flex; align-items: center; padding: 0 16px; font-size: 15px; text-decoration: none; ';
const on = base + 'font-weight: 600; color: #5B2BC4; border-bottom: 3px solid #5B2BC4; padding-top: 3px';
const off = base + 'font-weight: 500; color: #3D3552; border-bottom: 3px solid transparent; padding-top: 3px';
return { l1: a === 'oefeningen' ? on : off, l2: a === 'trainingen' ? on : off, l3: off };
}
}
</script>
