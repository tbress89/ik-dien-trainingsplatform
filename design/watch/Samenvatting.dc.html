<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Na de training</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 416px; height: 496px; box-sizing: border-box; background: #000; color: #fff; font-family: Figtree, system-ui, sans-serif; padding: 30px 30px 26px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 16px">
<span style="font-size: 28px; font-weight: 700; color: #a78bef">Klaar</span>
<span style="font-size: 30px; font-weight: 600">19:46</span>
</div>
<div style="display: flex; align-items: baseline; gap: 12px; padding: 0 16px">
<span style="font-family: 'Barlow Condensed', sans-serif; font-size: 64px; font-weight: 700; line-height: 1">75′</span>
<span style="font-size: 24px; color: #2fc4a3; font-weight: 600">op tijd klaar</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 0 16px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 12px">
<span style="flex: 1; font-size: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span>
<span style="width: 110px; height: 10px; border-radius: 5px; background: #222; display: flex; overflow: hidden" aria-hidden="true"><span style="width: {{r.w}}; background: {{r.color}}"></span></span>
<span style="width: 44px; text-align: right; font-size: 22px; font-weight: 700; color: {{r.deltaColor}}">{{r.delta}}</span>
</div>
</sc-for>
</div>
<button type="button" style="height: 76px; margin-top: auto; border: 0; border-radius: 38px; background: #6f42e0; color: #fff; font-family: Figtree, system-ui, sans-serif; font-size: 26px; font-weight: 700">Bewaar bij training</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":416,"height":496}}'>
class Component extends DCLogic {
  renderVals() {
    const wu = '#f2a541', kern = '#2fc4a3', pv = '#a78bef';
    const items = [
      ['Rondo 4 tegen 1', 15, 16, wu],
      ['Passvierkant', 15, 16, kern],
      ['Positiespel 5 + 3', 15, 18, kern],
      ['Afwerken', 10, 8, kern],
      ['Partijvorm 5 tegen 5', 20, 17, pv],
    ];
    const rows = items.map(([title, plan, real, color]) => {
      const d = real - plan;
      return {
        title,
        color,
        w: `${Math.round((real / 20) * 100)}%`,
        delta: d === 0 ? '0' : d > 0 ? `+${d}′` : `−${-d}′`,
        deltaColor: d > 0 ? '#f2a541' : '#9ad8c9',
      };
    });
    return { rows };
  }
}
</script>
</body>
</html>
