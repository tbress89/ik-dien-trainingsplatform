<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Achter op schema: herplannen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 416px; height: 496px; box-sizing: border-box; background: #000; color: #fff; font-family: Figtree, system-ui, sans-serif; padding: 30px 30px 26px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 16px">
<span style="font-size: 28px; font-weight: 700; color: #f2a541">5′ achter</span>
<span style="font-size: 30px; font-weight: 600">19:21</span>
</div>
<span style="font-size: 26px; line-height: 1.25; padding: 0 16px">Toch om 19:45 klaar? Zo past het:</span>
<div style="background: #141414; border-radius: 24px; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 8px; height: 40px; border-radius: 4px; background: {{r.color}}" aria-hidden="true"></span>
<span style="flex: 1; font-size: 24px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span>
<span style="font-size: 24px; color: #8a8a8a; text-decoration: line-through">{{r.from}}</span>
<span style="font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 700; color: {{r.color}}">{{r.to}}</span>
</div>
</sc-for>
</div>
<span style="font-size: 22px; color: #b5b5b5; padding: 0 16px">Alleen wat nog moet komen wordt korter</span>
<div style="display: flex; gap: 12px; margin-top: auto">
<button type="button" style="flex: 1; height: 76px; border: 0; border-radius: 38px; background: #262626; color: #fff; font-family: Figtree, system-ui, sans-serif; font-size: 26px; font-weight: 700">Uitlopen</button>
<button type="button" style="flex: 1.3; height: 76px; border: 0; border-radius: 38px; background: #f2a541; color: #000; font-family: Figtree, system-ui, sans-serif; font-size: 26px; font-weight: 700">Inkorten</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":416,"height":496}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { title: 'Afwerken', from: '10′', to: '8′', color: '#2fc4a3' },
        { title: 'Partijvorm', from: '20′', to: '17′', color: '#a78bef' },
      ],
    };
  }
}
</script>
</body>
</html>
