# Runs the tests on pull requests and on pushes to other branches, so problems show up before they're
# merged into main (where deploy.yml runs the same tests before publishing).
name: Tests

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codebase
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: codebase/.nvmrc
          cache: npm
          cache-dependency-path: codebase/package-lock.json

      - run: npm ci
      - run: npm test
      # The type check and build catch other mistakes (a typo in a component, a missing import).
      - run: npm run build
